<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .form{
      background: rgb(203, 182, 182);
      padding: 25px;
      border-radius: 12px;
      width: 350px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input{
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      height: 100px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #000000;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button:hover {
      background: #616069;
    }
  </style>
</head>

<body>

  <div class="form">
    <h2>Contact Us</h2>

    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Write your message..."></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
